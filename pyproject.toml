flavourbench-freeze-task-validation-campaign = "flavourbench.task_validation_campaign:run"
flavourbench-bundle-frontier-evidence = "flavourbench.frontier_evidence:run"
flavourbench-render-frontier-paper-table = "flavourbench.frontier_paper_asset:run"
