flavourbench-inventory-epicure-lineage = "flavourbench.epicure_lineage_inventory:run"
flavourbench-audit-epicure-candidate-lineage = "flavourbench.epicure_candidate_lineage:run"
flavourbench-freeze-reasoning-sensitivity = "flavourbench.reasoning_effort_sensitivity:run"

[project.urls]
Homepage = "https://github.com/josefchen/flavourbench"
Dataset = "https://huggingface.co/datasets/josefchen/flavourbench"
Leaderboard = "https://huggingface.co/spaces/josefchen/flavourbench"
Paper = "https://arxiv.org/abs/2608.20574"

[tool.hatch.build.targets.wheel]
packages = ["src/flavourbench"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/flavourbench/tasks.py" = ["E501"]
"src/flavourbench/season0_visualization.py" = ["E501"]
"src/flavourbench/pilot_publication_assets.py" = ["E501"]
"src/flavourbench/expert_calibration.py" = ["E501"]
"hf/space/app.py" = ["E501"]
