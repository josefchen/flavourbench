flavourbench-run-frontier-coverage-continuation = "flavourbench.frontier_coverage_continuation_executor:run"
flavourbench-materialize-frontier-coverage-postrun = "flavourbench.frontier_coverage_postrun:run"
flavourbench-render-frontier-corrections = "flavourbench.current_frontier_correction_assets:run"
flavourbench-render-required-pilot-paper = "flavourbench.required_pilot_assets:run"
flavourbench-import-required-pilot-review = "flavourbench.required_pilot_review_import:run"
flavourbench-rotate-anonymous-pool = "flavourbench.anonymous_pool_rotation:run"
flavourbench-freeze-season1-panel = "flavourbench.season1_panel:run"
flavourbench-render-academic-audit = "flavourbench.academic_figures:run"
flavourbench-expert-calibration = "flavourbench.expert_calibration:run"
flavourbench-import-author-evaluator-pool = "flavourbench.author_evaluator_import:run"
flavourbench-build-anonymous-review-report = "flavourbench.anonymous_review_report:run"
flavourbench-build-real-human-pilot = "flavourbench.real_human_pilot:run"
flavourbench-backfill-real-pilot-validators = "flavourbench.validator_backfill:run"
flavourbench-build-season1-readiness = "flavourbench.season1_readiness:run"
