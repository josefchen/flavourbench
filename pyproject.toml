flavourbench-export-season0-web = "flavourbench.season0_web_export:run"
flavourbench-package-season0 = "flavourbench.season0_release:run"
flavourbench-frontier-refresh = "flavourbench.frontier_refresh:run"
flavourbench-run-cohere-compatibility = "flavourbench.cohere_compatibility:run"
flavourbench-run-kimi-compatibility = "flavourbench.kimi_compatibility:run"
flavourbench-freeze-qwencloud-catalog = "flavourbench.qwencloud_catalog:run"
flavourbench-run-qwencloud-pair = "flavourbench.direct_qwencloud_pair:run"
flavourbench-freeze-qwencloud-route = "flavourbench.qwencloud_route_manifest:run"
flavourbench-reserve-qwencloud-smoke = "flavourbench.qwencloud_smoke_admission:run"
