[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "epicure-flavourbench"
version = "1.3.0"
description = "Executable culinary evaluation and dense reward training for language models"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Josef Chen" },
  { name = "Erim Hayretci" },
]
keywords = ["benchmark", "culinary", "evaluation", "llm", "reinforcement-learning"]
dependencies = [
  "alembic>=1.13,<2",
  "arena-rank==0.1.1",
  "cryptography==50.0.0",
  "fastapi>=0.115,<1",
  "huggingface-hub>=1,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
bedrock = [
  "anthropic[bedrock]>=0.60,<1",
  "boto3==1.43.48",
  "botocore==1.43.48",
]
distributed = [
  "modal==1.5.3",
]
training = [
  "accelerate>=1.14,<2",
  "datasets>=5,<6",
  "peft>=0.20,<1",
  "trackio>=0.35,<1",
  "transformers>=5.15,<6",
  "trl>=1.10,<2",
]
transformers = [
  "accelerate>=1.14,<2",
  "torch>=2.6,<3",
  "transformers>=5.15,<6",
]
dev = [
  "ipykernel>=6.29,<8",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.10,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
flavourbench = "flavourbench.lab_cli:main"
flavourbench-api = "flavourbench.main:run"
flavourbench-worker = "flavourbench.worker:run"
flavourbench-seed = "flavourbench.seed:run"
flavourbench-smoke = "flavourbench.smoke:run"
flavourbench-live-smoke = "flavourbench.live_smoke:run"
flavourbench-freeze-frontier-manifest = "flavourbench.frontier_manifest:run"
flavourbench-reconcile-live-smoke = "flavourbench.reconcile:run"
flavourbench-run-frontier-contracts = "flavourbench.frontier_contract_runner:run"
flavourbench-run-real-dataset = "flavourbench.real_dataset_runner:run"
flavourbench-aggregate-real-evidence = "flavourbench.evidence_aggregate:run"
flavourbench-render-real-operational-figure = "flavourbench.operational_figure:run"
flavourbench-bedrock-preflight = "flavourbench.bedrock_manifest:run"
flavourbench-bedrock-contract-smoke = "flavourbench.bedrock_contract_smoke:run"
flavourbench-bedrock-mantle-plan = "flavourbench.bedrock_mantle:run"
flavourbench-freeze-bedrock-b2 = "flavourbench.bedrock_b2_manifest:run"
flavourbench-run-bedrock-b2 = "flavourbench.bedrock_b2_runner:run"
flavourbench-build-real-task-bank = "flavourbench.real_task_bank:run"
flavourbench-build-development-task-validity = "flavourbench.development_task_validity:run"
flavourbench-build-development-task-validity-v2 = "flavourbench.development_task_validity_v2:run"
flavourbench-build-development-task-validation = "flavourbench.development_task_validation:run"
flavourbench-build-current-development-manifest = "flavourbench.current_development_manifest:run"
flavourbench-build-routed-development-manifest = "flavourbench.routed_development_manifest:run"
flavourbench-direct-kimi-pair = "flavourbench.direct_kimi_pair:run"
flavourbench-direct-cohere-pair = "flavourbench.direct_cohere_pair:run"
flavourbench-build-cohere-development-manifest = "flavourbench.cohere_development_manifest:run"
flavourbench-matched-protocol-preflight = "flavourbench.matched_protocol_preflight:run"
flavourbench-curate-real-tasks = "flavourbench.task_curation:run"
flavourbench-build-historical-task-pool = "flavourbench.stackexchange_dump:run"
flavourbench-run-season0-compatibility = "flavourbench.season0_compatibility:run"
flavourbench-freeze-season0-tasks = "flavourbench.season0_tasks:run"
flavourbench-run-season0-openrouter-compatibility = "flavourbench.season0_openrouter_compatibility:run"
flavourbench-sync-season0-openrouter-routes = "flavourbench.season0_openrouter_routes:run"
flavourbench-freeze-season0-epicure = "flavourbench.season0_epicure_release:run"
flavourbench-freeze-season0-models = "flavourbench.season0_model_manifest:run"
flavourbench-run-season0-collection = "flavourbench.legacy_paid_cli:run_season0_collection"
flavourbench-audit-season0-calibration = "flavourbench.season0_calibration:run"
flavourbench-reconcile-season0-costs = "flavourbench.season0_costs:run"
flavourbench-freeze-season0-cost-envelope = "flavourbench.season0_cost_envelope:run"
