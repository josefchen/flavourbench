name: FlavourBench public release integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark and development dependencies
        run: pip install -e '.[dev]' -r hf/space/requirements.txt

      - name: Verify the complete public release
        run: make ci
